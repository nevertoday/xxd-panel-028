<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 028</title>
  <desc>A quiet source-colour isometric paper miniature on one small cut-out base, with fine ink edges, flat colour planes, light shadow, subtle grain, and five-language documentation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="25" height="23" patternUnits="userSpaceOnUse"><path d="M2 7L10 6M14 18L23 17M6 22L11 21" stroke="#384B48" stroke-opacity=".05" stroke-width=".7"/><circle cx="19" cy="5" r=".5" fill="#384B48" fill-opacity=".06"/></pattern>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".45" fill="#243B38" fill-opacity=".1"/><circle cx="6" cy="5" r=".35" fill="#243B38" fill-opacity=".08"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#253B39" flood-opacity=".13"/></filter>
  </defs>
  <g clip-path="url(#frame)">
