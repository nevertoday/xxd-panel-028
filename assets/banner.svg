    <g transform="translate(755 89)" filter="url(#shadow)">
      <path d="M0 145L165 50L355 160L188 257Z" fill="#D8C7A5"/><path d="M0 145L188 257V276L0 164Z" fill="#B8A783"/><path d="M188 257L355 160V179L188 276Z" fill="#A29475"/>
      <path d="M83 133L166 85L252 135L168 184Z" fill="#6F8F87" stroke="#334B47" stroke-width="2"/><path d="M83 133L168 184V233L83 182Z" fill="#55766F" stroke="#334B47" stroke-width="2"/><path d="M168 184L252 135V184L168 233Z" fill="#486860" stroke="#334B47" stroke-width="2"/>
      <path d="M105 122L166 87L227 122L166 158Z" fill="#C47B62" stroke="#334B47" stroke-width="2"/><path d="M166 158L227 122V142L166 178Z" fill="#A85F4B" stroke="#334B47" stroke-width="2"/>
      <path d="M132 198V154L153 166V210" fill="#E3D3B7" stroke="#334B47" stroke-width="2"/><path d="M194 169V211L218 197V155" fill="#9FB7AE" stroke="#334B47" stroke-width="2"/>
      <path d="M34 158L80 132M268 199L321 169" stroke="#334B47" stroke-width="1.5"/>
