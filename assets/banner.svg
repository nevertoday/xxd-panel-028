    <text x="766" y="74" fill="#334B47" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="3">ONE PLACE / ONE SCALE / SOURCE COLOUR</text>
    <text x="1160" y="39" text-anchor="end" fill="#334B47" fill-opacity=".6" font-family="Arial, sans-serif" font-size="11" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text><text x="1160" y="56" text-anchor="end" direction="rtl" fill="#334B47" fill-opacity=".6" font-family="Arial, sans-serif" font-size="11" font-weight="700">العربية</text>
  </g>
  <g transform="translate(64 54)"><text x="0" y="20" fill="#334B47" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">🦁 XXD / IMAGE SKILL</text><text x="0" y="111" fill="#334B47" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">PANEL <tspan fill="#C47B62">028</tspan></text><text x="2" y="151" fill="#334B47" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing=".8">ISOMETRIC · PAPER BASE · SOURCE COLOUR</text><text x="2" y="193" fill="#334B47" font-family="sans-serif" font-size="18" font-weight="700">等距纸上微缩景观 · 把独特的体量与颜色安放下来</text><text x="2" y="222" fill="#334B47" fill-opacity=".72" font-family="sans-serif" font-size="14" font-weight="600">紙上の等距ミニチュア · 종이 위 등거리 미니어처</text><text x="2" y="251" fill="#334B47" fill-opacity=".72" font-family="Arial, sans-serif" font-size="14" font-weight="600">مجسم متساوي القياس على الورق</text></g>
